<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do site</title>
<link rel="icon" href="/assets/brand/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="admin.css">
<script type="module" src="app.js"></script>
</head>
<body>
<!-- Login -->
<section class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/assets/brand/logo.svg" alt="" width="56" height="56">
    <h1>Painel do site</h1>
    <p class="muted" id="login-msg">Digite a senha para editar o site.</p>
    <label for="pw">Senha</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="error" id="login-err" role="alert"></p>
  </form>
</section>

<!-- Editor -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <a class="logo" href="/" target="_blank" rel="noopener" title="Abrir o site publicado"><img src="/assets/brand/logo.svg" alt="" width="30" height="30"><span>Painel</span></a>
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="top-actions">
      <button class="icon-btn" id="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer" disabled>↶</button>
      <button class="icon-btn" id="redo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer" disabled>↷</button>
      <button class="btn ghost hide-sm" id="open-draft" title="Abrir o rascunho em uma nova aba (também serve para ver no celular)">Ver rascunho</button>
      <button class="btn primary" id="publish">Publicar</button>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Seções do painel"></nav>
  <main class="editor" id="editor" tabindex="-1"></main>
  <aside class="preview-pane" id="preview-pane" aria-label="Prévia">
    <div class="preview-bar">
      <div class="seg" role="group" aria-label="Tamanho da tela">
        <button data-device="desktop" aria-pressed="true">Computador</button>
        <button data-device="tablet" aria-pressed="false">Tablet</button>
        <button data-device="mobile" aria-pressed="false">Celular</button>
      </div>
      <div class="seg" role="group" aria-label="Idioma da prévia">
        <button data-plang="pt" aria-pressed="true">PT</button>
        <button data-plang="en" aria-pressed="false">EN</button>
        <button data-plang="ja" aria-pressed="false">JA</button>
      </div>
      <button class="icon-btn" id="reload-preview" title="Recarregar prévia" aria-label="Recarregar prévia">⟳</button>
      <button class="icon-btn" id="toggle-preview" title="Esconder prévia" aria-label="Esconder prévia">⇥</button>
    </div>
    <div class="preview-stage" id="preview-stage"><iframe id="preview" title="Prévia do site"></iframe></div>
  </aside>
  <button class="btn ghost show-preview" id="show-preview" hidden>Mostrar prévia</button>
</div>

<dialog class="modal" id="modal"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
