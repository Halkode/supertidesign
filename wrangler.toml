# Cloudflare Workers: o Worker (worker.js) serve a página publicada, o painel e a API;
# os arquivos de public/ são servidos como estáticos.
name = "supertidesign"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "public"
binding = "ASSETS"
# Só estes caminhos passam pelo Worker; css, js e imagens saem direto dos estáticos.
run_worker_first = ["/", "/api/*", "/admin", "/admin/*", "/media/*"]

# Logs e rastreamento: igual ao que está no painel da Cloudflare (Settings → Observability),
# senão cada deploy sobrescreve o que foi configurado lá.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Banco D1: rascunho, versões publicadas, lista de mídias, sessões e registro de acessos
[[d1_databases]]
binding = "DB"
database_name = "supertidesign"
database_id = "5c5c665c-0292-4e2f-b2fb-17b31b84d741"

# Bucket R2: fotos, fontes e PDFs enviados pelo painel (servidos em /media/...)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "supertidesign-media"

# Segredos (não ficam aqui): ADMIN_PASSWORD e SESSION_SECRET
#   produção:  Cloudflare → Workers & Pages → supertidesign → Settings → Variables and Secrets
#   local:     arquivo .dev.vars (veja .dev.vars.example)
